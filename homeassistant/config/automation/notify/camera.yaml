---

- alias: 'Reolink Motion Push Notification'
  id: '98d1c7bd-5abf-4f4c-ab0a-c72cce8456fe'
  description: 'Sends a snapshot when a person or animal is detected in the garden while no one is home.'
  mode: queued
  max: 3
  trigger:
    - trigger: state
      entity_id: binary_sensor.rlc_510wa_aboulafia_person
      to: 'on'
      id: 'person'
    - trigger: state
      entity_id: binary_sensor.rlc_510wa_aboulafia_animal
      to: 'on'
      id: 'animal'
  condition:
    - condition: state
      entity_id: group.person
      state: 'not_home'
    - condition: template
      value_template: >-
        {{ as_timestamp(now()) - as_timestamp(state_attr(this.entity_id, 'last_triggered'), 0) > 30 }}
  action:
    # Define all dynamic variables upfront based on the trigger.
    # This keeps the logic clean and avoids repeating code (DRY principle).
    - variables:
        object_type: "{{ trigger.id | capitalize }}"
        timestamp: "{{ now().strftime('%Y%m%d_%H%M%S') }}"
        snapshot_filename: "reolink/{{ trigger.id }}_{{ timestamp }}.jpg"
    - action: camera.snapshot
      target:
        entity_id: camera.rlc_510wa_aboulafia_fluent
      data:
        filename: "/config/www/{{ snapshot_filename }}"
    - action: camera.snapshot
      target:
        entity_id: camera.rlc_510wa_aboulafia_fluent
      data:
        filename: "/config/www/reolink/latest.jpg"
    - delay:
        seconds: 1
    - choose:
        - conditions:
            - condition: trigger
              id: "person"
          sequence:
            - action: ai_task.generate_data
              data:
                entity_id: ai_task.google_ai_task
                task_name: "Person Detection"
                instructions: >
                  Write a short description of the person detected, based on an image.
                  The description should highlight observable traits like race, clothing, hair color, accessories, approximate age, gender, and if they are have any weapons.
                  If the person appears to be a mail carrier, delivery worker, or police officer, include identifying uniforms, badges, logos, or parcels.
                  Suitable for a smart home notification.
                  Keep the response under 100 tokens. No emojis.
                  It should be written as if spoken by a ill tempered easy to irritate old man that uses cuss words.
                attachments:
                  - media_content_id: "media-source://media_source/local/{{ snapshot_filename }}"
                    media_content_type: "image/jpeg"
                    metadata:
                      title: "Garden Person"
                      media_class: "image"
              response_variable: ai_description
            - action: notify.mobile_app_pixel_10a
              data:
                title: "Person Detected in Garden"
                message: >
                  A person was detected at {{ now().strftime('%H:%M') }}.
                  {{ ai_description.data }}
                data:
                  image: "/local/{{ snapshot_filename }}"
                  tag: "garden-camera-alert"
                  channel: "alerts"
                  priority: "high"
        - conditions:
            - condition: trigger
              id: "animal"
          sequence:
            - action: notify.mobile_app_pixel_10a
              data:
                title: "Animal Detected in Garden"
                message: "An animal was detected by the garden camera at {{ now().strftime('%H:%M') }}."
                data:
                  image: "/local/{{ snapshot_filename }}"
                  tag: "garden-camera-alert"
                  channel: "alerts"
                  priority: "low"
